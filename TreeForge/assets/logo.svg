<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tfGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="anvilGrad" x1="20" y1="42" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6edf7"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded-square emerald gradient tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tfGrad)" filter="url(#shadow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Minimal Branching Tree Network -->
  <!-- Main Trunk -->
  <path d="M32 46V28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Left Branch -->
  <path d="M32 34C26 34 22 30 22 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Branch -->
  <path d="M32 30C38 30 42 26 42 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Terminal Nodes (Leaves / Files) -->
  <circle cx="32" cy="18" r="3.5" fill="#ffffff"/>
  <circle cx="22" cy="20" r="3" fill="#ffffff"/>
  <circle cx="42" cy="16" r="3" fill="#ffffff"/>

  <!-- Root Anvil / Forge Base with Spark -->
  <path d="M22 47H42L39 52H25L22 47Z" fill="url(#anvilGrad)"/>
  <!-- Spark accent on the forge root -->
  <path d="M32 44L33.2 46.5L35.5 47.5L33.2 48.5L32 51L30.8 48.5L28.5 47.5L30.8 46.5Z" fill="#fbbf24"/>
</svg>
