    <style>
      vite-error-overlay {
        display: none !important;
      }
    </style>
    <script>
      // Suppress harmless Vite dev WebSocket errors in AI Studio iframe environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { 
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : String(a)))) || ''; 
          }).join(' ').toLowerCase();

          if (
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('closed without opened') !== -1 || 
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        function isWsError(err) {
          if (!err) return false;
          var msg = (err.message || err.stack || String(err) || '').toLowerCase();
          return msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('failed to connect') !== -1;
        }

        window.addEventListener('unhandledrejection', function (event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function (event) {
          if (isWsError(event.error) || isWsError(event.message)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

  <body>

  </body>
