name: Validate TreeForge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run lint
      - run: python tools/sync_installer_runtime.py --check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python TreeForge/make_zip.py
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      TREEFORGE_REQUIRE_QT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r TreeForge/requirements-dev.txt
      - run: python -m unittest discover -s TreeForge/tests -p "test_*.py"
      - name: Build Windows executable
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python -m PyInstaller --noconsole --onefile --name TreeForge --add-data "TreeForge/assets;TreeForge/assets" main.py
      - name: Build Windows installer
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" TreeForge_Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
